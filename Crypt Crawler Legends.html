<html lang="ru"><head><meta charset="utf-8">

<title>Crypt Crawler</title>
<style>

</style></head><body>
<canvas id="c" width="800" height="500"></canvas>
<p>Ходить: WASD · Стрелять: стрелки или зажатая мышь · Купить в хабе: E · Старт: Enter или клик</p>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=800,H=500,R={x:30,y:50,w:740,h:420};
const K={},M={x:0,y:0,d:0};
let S='menu',P,E=[],B=[],I=[],OB=[],lvl=0,th,score=0,best=0,msg='',mt=0,cleared=0,arts=[],tm=0;
try{best=+localStorage.getItem('cc_best')||0}catch(e){}
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

/* Темы подземелий: пол, стены, акцент (по одной на уровень) */
const TH=[['#2b2733','#4b4560','#a58cff'],['#1f2f2a','#3d5a4e','#6fe0a8'],['#33261f','#5e432f','#ffb067'],['#1d2a38','#36506b','#6cc7ff'],['#331a1f','#6b2a35','#ff5c6e']];
/* Варианты планировки комнат: прямоугольники-препятствия [x,y,w,h] */
const L=[[],
 [[200,150,50,50],[550,150,50,50],[200,330,50,50],[550,330,50,50]],
 [[350,210,100,100]],
 [[150,180,200,24],[450,320,200,24]],
 [[250,90,24,140],[526,290,24,140],[380,230,40,60]]];
/* Артефакты: [название, описание, эффект] */
const A=[
 ['Острые зубы','+1 к урону',p=>p.dmg+=1],
 ['Кофеин','Стрельба на 30% быстрее',p=>p.rate*=.7],
 ['Сапоги-скороходы','+30 к скорости',p=>p.spd+=30],
 ['Сердце титана','+2 макс. HP и лечение',p=>{p.max+=2;p.hp=p.max}],
 ['Тройной выстрел','+1 снаряд за выстрел',p=>p.multi++],
 ['Призрачные пули','Пули пробивают врагов',p=>p.pierce++],
 ['Тяжёлые ядра','Крупнее и сильнее (+0.5)',p=>{p.size+=2;p.dmg+=.5}],
 ['Ястребиный глаз','Пули быстрее и летят дальше',p=>p.bs+=160],
 ['Золотая жила','Очки за убийства x1.5',p=>p.sm*=1.5]];
/* Враги: радиус, HP, очки, цвет */
const D=[[11,3,10],[11,4,20],[14,7,30],[34,100,500],[34,90,600],[34,130,700]];
/* Сложности подземелий: множитель HP, доп. враги, прибавка скорости пуль, множитель монет */
const DF=[{n:'Лёгкое',c:'#4fe07a',hp:1,ex:0,bs:0,coin:1,sl:1,mv:1},{n:'Сложное',c:'#4ca8ff',hp:1.5,ex:2,bs:30,coin:1.7,sl:1.2,mv:1.15},{n:'Очень сложное',c:'#ff4d5a',hp:2.2,ex:4,bs:60,coin:2.6,sl:1.33,mv:1.3}];
/* Улучшения в хабе: название, описание, цена за уровень, макс. уровень, значок */
const UP=[['Здоровье','+1 макс. HP',30,5,'♥'],['Урон','+0.25 урона',40,5,'!'],['Скорость','+12 к скорости',25,5,'»'],['Скорострельность','-8% задержки выстрела',35,5,'~']];
const HUB=['#26232f','#3f3a55','#e8d9a8'],PORT=[250,400,550].map(x=>({x,y:110})),SH=[220,340,460,580].map((x,i)=>({x,y:380,i}));
let df=0,near=null,runCoins=0,winShown=0,MS={coins:0,up:[0,0,0,0],city:[0,0,0,0,0,0]};
/* Постройки города: название, цена */
const BL=[['Ратуша',100],['Кузница',200],['Таверна',300],['Рынок',450],['Башня',650],['Замок',900]],CT=BL.map((b,i)=>({x:190+i%3*190,y:i<3?190:350,i,c:1})),GT={x:712,y:270},GC={x:58,y:270},CTH=['#2f4a2c','#5a4a3a','#b8e6a0'];
try{Object.assign(MS,JSON.parse(localStorage.getItem('cc_meta')))}catch(e){}
function saveMeta(){try{localStorage.setItem('cc_meta',JSON.stringify(MS))}catch(e){}}

addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code=='Space')e.preventDefault();if(e.code=='Enter'&&S!='play'&&S!='hub'&&S!='city')hub();if(e.code=='Enter')winShown=0;if(e.code=='KeyE'&&(S=='hub'||S=='city')&&near)near.c?build(near.i):buy(near.i)});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('mousemove',e=>{const b=cv.getBoundingClientRect();M.x=(e.clientX-b.left)*W/b.width;M.y=(e.clientY-b.top)*H/b.height});
cv.addEventListener('mousedown',()=>{M.d=1;winShown=0;if(S!='play'&&S!='hub'&&S!='city')hub()});
addEventListener('mouseup',()=>M.d=0);

/* Коллизии: круг против прямоугольника, стены комнаты */
function hitR(x,y,r,b){const cx=Math.max(b[0],Math.min(x,b[0]+b[2])),cy=Math.max(b[1],Math.min(y,b[1]+b[3]));return(x-cx)**2+(y-cy)**2<r*r}
function blocked(x,y,r){return x<R.x+r||x>R.x+R.w-r||y<R.y+r||y>R.y+R.h-r||OB.some(b=>hitR(x,y,r,b))}
function mv(o,dx,dy){if(!blocked(o.x+dx,o.y,o.r))o.x+=dx;if(!blocked(o.x,o.y+dy,o.r))o.y+=dy}

function mk(t,x,y){const d=D[t],hp=t>2?d[1]*(1+(DF[df].hp-1)*.4):d[1]*(1+(lvl-1)*.2)*DF[df].hp;return{t,x,y,r:d[0],hp,mh:hp,pts:d[2],col:d[3],cd:rnd(.6,1.5),sp:1,k:0,dash:0,vx:0,vy:0,f:0}}
function save(){best=Math.max(best,score);try{localStorage.setItem('cc_best',best)}catch(e){}}
function hub(){S='hub';th=HUB;OB=[];E=[];B=[];I=[];near=null;P={x:400,y:300,r:10,spd:170+12*MS.up[2],inv:0,ph:0,m:0}}
function run(d){df=d;score=0;lvl=0;arts=[];const u=MS.up;P={x:400,y:430,r:10,hp:6+u[0],max:6+u[0],spd:170+12*u[2],dmg:1+.25*u[1],rate:.35*.92**u[3],cd:0,bs:380,pierce:0,multi:1,size:4,inv:0,sm:1,ph:0,m:0};next()}
function endRun(w){S=w?'win':'dead';if(w)score+=1000;runCoins=Math.round(score/10*DF[df].coin);MS.coins+=runCoins;saveMeta();save()}
function buy(i){const u=UP[i],lv=MS.up[i],c=u[2]*(lv+1);
 if(lv>=u[3])msg='Уже максимум';else if(MS.coins<c)msg='Не хватает монет';else{MS.coins-=c;MS.up[i]++;saveMeta();msg='Куплено: '+u[0]}mt=2}
function build(i){const b=BL[i];
 if(MS.city[i])msg='Уже построено';else if(MS.coins<b[1])msg='Не хватает монет';
 else{MS.coins-=b[1];MS.city[i]=1;saveMeta();msg=MS.city.every(x=>x)?(winShown=1,'Город отстроен! Победа!'):'Построено: '+b[0]}mt=3}
function goTo(s){S=s;th=s=='city'?CTH:HUB;P.x=s=='city'?100:670;P.y=270;near=null}
function hupd(dt){const p=P;if(winShown)return;let mx=(K.KeyD|0)-(K.KeyA|0),my=(K.KeyS|0)-(K.KeyW|0);const l=Math.hypot(mx,my)||1;
 mv(p,mx/l*p.spd*dt,my/l*p.spd*dt);p.m=mx||my;p.ph+=dt*10;
 const hb=S=='hub';if(hb)for(let i=0;i<3;i++)if(dist(p,PORT[i])<26){run(i);return}
 if(dist(p,hb?GT:GC)<28){goTo(hb?'city':'hub');return}
 near=(hb?SH:CT).find(s=>dist(p,s)<32)||null}
function next(){
 lvl++;S='play';cleared=0;B=[];I=[];E=[];th=TH[lvl-1];OB=lvl==5?[]:pick(L);P.x=400;P.y=430;
 if(lvl==5)E.push(mk([3,4,5][df],400,130));
 else for(let i=0,n=3+lvl*2+DF[df].ex;i<n;i++){let x,y;do{x=rnd(R.x+30,R.x+R.w-30);y=rnd(R.y+30,R.y+250)}while(blocked(x,y,16));E.push(mk(lvl==1?pick([0,0,1]):pick([0,1,2]),x,y))}
}
function hurt(){if(S!='play'||P.inv>0)return;P.hp=Math.max(0,P.hp-1);P.inv=1;if(P.hp==0)endRun(0)}
function eb(x,y,a,s){s+=DF[df].bs;B.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5,own:0,life:4})}

function upd(dt){
 const p=P;p.inv-=dt;p.cd-=dt;tm+=dt;
 /* движение игрока */
 let mx=(K.KeyD|0)-(K.KeyA|0),my=(K.KeyS|0)-(K.KeyW|0);const l=Math.hypot(mx,my)||1;
 mv(p,mx/l*p.spd*dt,my/l*p.spd*dt);p.m=mx||my;p.ph+=dt*10;
 /* стрельба */
 let sx=(K.ArrowRight|0)-(K.ArrowLeft|0),sy=(K.ArrowDown|0)-(K.ArrowUp|0);
 if(!sx&&!sy&&M.d){sx=M.x-p.x;sy=M.y-p.y}
 if((sx||sy)&&p.cd<=0){p.cd=p.rate;const a=Math.atan2(sy,sx);
  for(let i=0;i<p.multi;i++){const q=a+(i-(p.multi-1)/2)*.2;B.push({x:p.x,y:p.y,vx:Math.cos(q)*p.bs,vy:Math.sin(q)*p.bs,r:p.size,dmg:p.dmg,own:1,life:1.2,pi:p.pierce,h:new Set()})}}
 /* ИИ врагов */
 for(const e of E){
  if(e.sp>0){e.sp-=dt;continue}
  e.f-=dt;const a=Math.atan2(p.y-e.y,p.x-e.x),d=dist(e,p),v=40+lvl*8,c=Math.cos(a),s=Math.sin(a);
  if(e.t==0)mv(e,c*(v+30)*DF[df].mv*1.15*dt,s*(v+30)*DF[df].mv*1.15*dt);                       /* бегун: преследует */
  else if(e.t==1){const m=d<230?-1:d>330?1:0;mv(e,c*m*v*1.6*dt,s*m*v*1.6*dt); /* стрелок: держит дистанцию */
   if((e.cd-=dt)<=0){e.cd=rnd(1.2,2)/DF[df].sl;eb(e.x,e.y,a,170+lvl*12)}}
  else if(e.t==4)bBoss(e,dt,a);else if(e.t==5)lBoss(e,dt,a);
  else if(e.t==2){                                               /* бык: рывок в игрока */
   if(e.dash>0){mv(e,e.vx*dt,e.vy*dt);if((e.dash-=dt)<=0)e.cd=1.1/DF[df].mv}
   else if((e.cd-=dt)<=0){e.vx=c*340*DF[df].mv;e.vy=s*340*DF[df].mv;e.dash=.55}else mv(e,c*25*DF[df].mv*dt,s*25*DF[df].mv*dt)}
  else{                                                          /* босс: кольцо / веер, во 2-й фазе призывает */
   const ph=e.hp<e.mh/2;mv(e,c*(ph?55:35)*dt,s*(ph?55:35)*dt);
   if((e.cd-=dt)<=0){e.cd=ph?1.5:2.2;
    if(e.k++%2){const n=ph?18:12;for(let i=0;i<n;i++)eb(e.x,e.y,i/n*6.283+e.k,150)}
    else for(let i=-2;i<=2;i++)eb(e.x,e.y,a+i*.22,210);
    if(ph&&E.length<6)E.push(mk(0,e.x,e.y))}}
  if(d<e.r+p.r&&p.inv<=0)hurt();                                 /* касание */
 }
 /* пули */
 B=B.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||blocked(b.x,b.y,b.r*.6))return 0;
  if(b.own){for(const e of E){if(e.sp>0||b.h.has(e)||dist(b,e)>=e.r+b.r)continue;b.h.add(e);e.hp-=b.dmg;e.f=.1;if(b.pi--<=0)return 0}}
  else if(dist(b,p)<p.r+b.r&&p.inv<=0){hurt();return 0}
  return 1});
 if(S!='play')return;
 /* смерть врагов, очки, выпадение сердец */
 E=E.filter(e=>{if(e.hp>0)return 1;score+=Math.round(e.pts*p.sm);if(Math.random()<.12)I.push({k:'h',x:e.x,y:e.y});return 0});
 if(lvl==5&&!E.some(e=>e.t>2))E=[];
 /* комната зачищена */
 if(!E.length&&!cleared){cleared=1;score+=100*lvl;
  if(lvl==5){endRun(1);return}
  const av=A.filter(a=>!arts.includes(a)).sort(()=>Math.random()-.5).slice(0,2);
  av.forEach((a,i)=>I.push({k:'a',x:300+i*200,y:260,a}));if(!av.length)I.push({k:'p',x:400,y:100})}
 /* предметы */
 for(const it of I){const d=dist(p,it);
  if(it.k=='h'&&d<22&&p.hp<p.max){p.hp++;I.splice(I.indexOf(it),1);break}
  if(it.k=='a'&&d<24){it.a[2](p);arts.push(it.a);msg=it.a[0]+': '+it.a[1];mt=3.5;I=I.filter(i=>i.k!='a');I.push({k:'p',x:400,y:100});break}
  if(it.k=='p'&&d<24){next();return}}
}

function tx(s,x,y,z,c,al){g.font=z+'px ui-monospace,Menlo,Consolas,monospace';g.fillStyle=c||'#eee';g.textAlign=al||'left';g.fillText(s,x,y)}
function veil(t,sub){g.fillStyle='rgba(8,6,12,.78)';g.fillRect(0,0,W,H);tx(t,400,200,44,'#fff','center');tx(sub,400,250,18,'#cfc8e0','center');
 tx('Счёт: '+score+'   Рекорд: '+best,400,295,18,'#ffd36b','center');tx('Монеты за забег: +'+runCoins,400,328,20,'#ffd36b','center');tx('Enter или клик — вернуться в хаб',400,368,16,'#aaa','center')}

function draw(){
 g.fillStyle='#0b0a10';g.fillRect(0,0,W,H);
 if(S=='menu'){
  tx('CRYPT CRAWLER',400,150,52,'#a58cff','center');
  ['Пройдите 5 уровней подземелья и побеждайте боссов.','Копите монеты и отстройте город — это главная цель.','Зачищайте комнату, берите артефакт, входите в портал.','WASD — ходьба · стрелки / мышь — стрельба','Рекорд: '+best].forEach((s,i)=>tx(s,400,215+i*32,17,i==4?'#ffd36b':'#d8d2e8','center'));
  tx('Enter или клик — начать',400,400,20,'#fff','center');return}
 const[f,w,ac]=th;
 g.fillStyle=w;g.fillRect(R.x-10,R.y-10,R.w+20,R.h+20);g.fillStyle=f;g.fillRect(R.x,R.y,R.w,R.h);
 g.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<19;i++)for(let j=0;j<11;j++)if((i+j)%2==0)g.fillRect(R.x+i*40,R.y+j*40,40,40);
 OB.forEach(b=>{g.fillStyle=w;g.fillRect(...b);g.strokeStyle=ac;g.lineWidth=2;g.strokeRect(b[0]+1,b[1]+1,b[2]-2,b[3]-2)});
 if(S=='hub'||S=='city'){drawHub(ac);return}
 for(const it of I){
  if(it.k=='h')tx('♥',it.x,it.y+7,22,'#ff5c6e','center');
  else if(it.k=='a'){g.fillStyle='#14111c';g.fillRect(it.x-14,it.y-14,28,28);g.strokeStyle=ac;g.lineWidth=3;g.strokeRect(it.x-14,it.y-14,28,28);tx(it.a[0][0],it.x,it.y+6,18,ac,'center');tx(it.a[0],it.x,it.y-24,12,'#fff','center')}
  else{const r=18+Math.sin(performance.now()/200)*3;g.strokeStyle=ac;g.lineWidth=4;g.beginPath();g.arc(it.x,it.y,r,0,7);g.stroke();tx('вход',it.x,it.y+34,12,'#fff','center')}}
for(const e of E)drawE(e);
 const bo=E.find(e=>e.t>2);
 if(bo){g.fillStyle='#000';g.fillRect(200,478,400,12);g.fillStyle=['#c04adf','#3fb8d0','#ff4d4d'][bo.t-3];g.fillRect(202,480,396*Math.max(0,bo.hp)/bo.mh,8)}
 for(const b of B){g.fillStyle=b.own?'#fff':'#ff4d6d';g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}
 if(P.inv<=0||Math.floor(P.inv*14)%2)man(P.x,P.y,P.ph,P.m,'#f2c9a0','#4aa3ff','#2c3560',0,0);
 /* HUD */
 g.fillStyle='#0b0a10';g.fillRect(0,0,W,40);
 for(let i=0;i<P.max;i++)tx('♥',16+i*20,28,20,i<P.hp?'#ff5c6e':'#6a5870');
 tx(DF[df].n+' · уровень '+lvl+'/5',400,27,16,DF[df].c,'center');
 tx('Счёт '+score,784,20,15,'#ffd36b','right');tx('Рекорд '+best,784,36,12,'#8a8499','right');
 arts.forEach((a,i)=>{g.fillStyle='#14111c';g.fillRect(R.x+i*24,477,20,20);g.strokeStyle=ac;g.lineWidth=2;g.strokeRect(R.x+i*24,477,20,20);tx(a[0][0],R.x+i*24+10,492,13,ac,'center')});
 if(mt>0)tx(msg,560,492,13,'#fff','center');
 if(cleared&&S=='play'&&I.some(i=>i.k=='a'))tx('Выберите один артефакт',400,100,16,'#fff','center');
 if(S=='dead')veil('Вы погибли','Вы дошли до уровня '+lvl+' из 5');
 if(S=='win')veil('Победа!','Босс повержен, подземелье пройдено');
}
/* Разные дома города (после ремонта) */
function bld(i,x,y){const B2=(c,a,b,w,h)=>{g.fillStyle=c;g.fillRect(x+a,y+b,w,h)},T=(c,p)=>{g.fillStyle=c;g.beginPath();p.forEach((q,j)=>g[j?'lineTo':'moveTo'](x+q[0],y+q[1]));g.fill()};
 if(i==0){B2('#d9c9a0',-24,-6,48,20);T('#7a3b32',[[-28,-6],[0,-26],[28,-6]]);el(x,y-12,5,5,0,'#fff');B2('#222',-.5,-15,1,4);B2('#222',-.5,-12.5,3,1);B2('#2b1d18',-4,2,8,12);B2('#8fb5d9',-19,-1,8,7);B2('#8fb5d9',11,-1,8,7)}
 else if(i==1){B2('#6d6f78',-22,-4,44,18);B2('#3d3f48',-25,-8,50,5);B2('#55575f',10,-28,8,20);el(x+14,y-32,6,3,0,'rgba(200,200,200,.6)');B2('#ff8a2b',-8,2,16,12);B2('#ffd36b',-4,6,8,8);B2('#222',-21,10,9,4)}
